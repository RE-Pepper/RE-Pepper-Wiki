site_name: RE:Pepper Wiki
project_name: RE:Pepper Project
project_short: RE:Pepper
ext_url: https://github.com/RE-Pepper
site_url: https://rep.moddi.dev/
#site_url: http://127.0.0.1:8000/

nav:
  - "About Project": about_me.md
  - "About Game": about_it.md
  - "Full Docs": wiki.md
  - Filelist: files.md
  - Classlist: classes.md

theme:
  name: null
  custom_dir: 'theme/'
  highlightjs: false

plugins:
  - search
  - macros
  - mkdoxy:
      projects:
        game: &doxy-cfg
          src-dirs: Game
          doxy-cfg:
            PROJECT_NAME: "RE-Pepper"
            GENERATE_XML: YES
            FULL_PATH_NAMES: NO
            STRIP_FROM_PATH: "/home/runner/work/RE-Pepper/RE-Pepper/"
            CASE_SENSE_NAMES: NO
            JAVADOC_AUTOBRIEF: YES
            DETAILS_AT_TOP: YES
            EXTRACT_ALL: YES
            EXTRACT_PRIVATE: YES
            EXTRACT_STATIC: YES
            EXTRACT_LOCAL_CLASSES: YES
            HIDE_UNDOC_MEMBERS: NO
            HIDE_UNDOC_CLASSES: NO
            HIDE_FRIEND_COMPOUNDS: NO
            HIDE_IN_BODY_DOCS: NO
            INLINE_INFO: YES
            FILE_PATTERNS: "*.c *.cpp *.h *.hpp"
            EXCLUDE_SYMBOLS: "static_assert*"
            RECURSIVE: True
            REFERENCED_BY_RELATION: YES
            REFERENCES_RELATION: YES
            PREDEFINED: "__cplusplus NN_PLATFORM_CTR NON_MATCHING DOXYGEN=1"
            CLASS_GRAPH: YES
            COLLABORATION_GRAPH: YES
            TEMPLATE_RELATIONS: YES
            CALL_GRAPH: YES
            SEARCHENGINE: YES

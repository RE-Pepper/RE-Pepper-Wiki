<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Project RedPepper: Decompilation of Super Mario 3D Land.">
    <link rel="stylesheet" href="{{ config.site_url }}assets/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Reggae+One&disp=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito&disp=swap" rel="stylesheet">
    <link rel="icon" href="{{ config.site_url }}assets/favicon.ico" type="image/x-icon">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ config.site_name }}</title>
  </head>
  <body>
    <div class="container">
      <nav>
        <ul>
        </ul>
      </nav>

      <!--Upper bar-->
      <div id="bar">

          <a id="barTitle" href="{{ config.site_url }}"><b>{{ config.project_name }}</b></a>
          
          <p> </p>
          
          {%- for item in nav %}
            <li>
              <button onclick="window.location.href='{{ config.site_url }}{{ item.url }}'">{{ item.title }}</button>
            </li>
          {%- endfor %}
      </div>
      
      {{ page.content }}

      {%- for script in config.extra_javascript %}
        {{ script | script_tag }}
      {%- endfor %}
    </div>
  </body>
</html>
